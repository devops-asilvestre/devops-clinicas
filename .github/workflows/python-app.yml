name: Python AWS Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest boto3 awscli
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest

    - name: Package Lambda code
      run: |
        zip -r package.zip lambda_function.py

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: lambda-package
        path: package.zip

  deploy-staging:
    name: Deploy to AWS Staging
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging   # ambiente staging

    steps:
    - uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: lambda-package

    - name: Configure AWS credentials
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set default.region us-east-1

    - name: Deploy Lambda to Staging
      run: |
        aws lambda update-function-code \
          --function-name minha-funcao-lambda-staging \
          --zip-file fileb://package.zip

  deploy-production:
    name: Deploy to AWS Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production   # ambiente production
      url: https://minha-app-producao.com
      # aqui você pode configurar aprovação manual no GitHub

    steps:
    - uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: lambda-package

    - name: Configure AWS credentials
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set default.region us-east-1

    - name: Deploy Lambda to Production
      run: |
        aws lambda update-function-code \
          --function-name minha-funcao-lambda-prod \
          --zip-file fileb://package.zip

    - name: Start Step Function execution
      run: |
        aws stepfunctions start-execution \
          --state-machine-arn arn:aws:states:us-east-1:123456789012:stateMachine:MinhaStateMachine \
          --input '{"acao":"deploy-prod"}'
